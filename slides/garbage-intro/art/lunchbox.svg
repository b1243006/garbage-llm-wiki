<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 300" role="img" aria-label="打開的紙便當盒和擦拭用的布">
  <!-- 打開的盒蓋 -->
  <path d="M60 150 L80 60 L270 60 L250 150 Z" fill="#f4e7cf" stroke="#17324d" stroke-width="4" stroke-linejoin="round"/>
  <path d="M92 74 L250 74" stroke="#e2cfa9" stroke-width="3"/>
  <!-- 盒身 -->
  <path d="M50 150 L260 150 L246 250 L64 250 Z" fill="#f4e7cf" stroke="#17324d" stroke-width="4" stroke-linejoin="round"/>
  <path d="M60 172 L250 172" stroke="#e2cfa9" stroke-width="3"/>
  <!-- 一點油漬 -->
  <ellipse cx="120" cy="208" rx="22" ry="9" fill="#e9c98b" opacity=".8"/>
  <ellipse cx="190" cy="222" rx="14" ry="6" fill="#e9c98b" opacity=".8"/>
  <!-- 擦拭的布 -->
  <path d="M206 186 Q232 176 262 188 L270 214 Q240 226 214 212 Z" fill="#c9e3f0" stroke="#17324d" stroke-width="4" stroke-linejoin="round"/>
  <path d="M230 186 L238 216" stroke="#17324d" stroke-width="2" opacity=".5"/>
  <!-- 擦拭動作 -->
  <path d="M150 196 Q176 184 196 196" fill="none" stroke="#5c6b77" stroke-width="3" stroke-dasharray="5 6" stroke-linecap="round"/>
  <!-- 水滴 -->
  <path d="M290 110 Q300 128 290 136 Q280 128 290 110 Z" fill="#7fb6dd" stroke="#17324d" stroke-width="2"/>
  <path d="M276 132 Q284 146 276 152 Q268 146 276 132 Z" fill="#7fb6dd" stroke="#17324d" stroke-width="2"/>
</svg>
